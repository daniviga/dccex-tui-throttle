[pytest]
# Pytest configuration for DCC-EX Throttle TUI

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=dccex_throttle
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Asyncio support
asyncio_mode = auto

# Markers
markers =
    asyncio: mark test as async
    slow: mark test as slow running
    integration: mark test as integration test

# Coverage options
[coverage:run]
source = dccex_throttle
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
